<div class="dashboard-container p-4">
  <h2 class="text-2xl font-bold mb-4">Analytics Dashboard</h2>
  <div class="stats-overview mb-6">
    <p class="text-lg">Total Tracking Views: <span class="font-semibold">{{ totalViews }}</span></p>
  </div>
  
  <div class="chart-container" style="width: 100%; max-width: 800px; height: 400px; position: relative;">
    <!-- 📊 Standalone Chart.js component -->
    <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="lineChartType">
    </canvas>
  </div>
</div>
