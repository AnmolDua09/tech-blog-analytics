<div class="feed-container">
  <div class="header">
    <h1>Explore Posts</h1>
    <p>Discover the latest tech articles and tutorials.</p>
  </div>

  <div class="controls">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        placeholder="Search for titles..." 
        class="search-input"
      />
    </div>

    <div class="tag-cloud">
      <button 
        class="tag-chip" 
        [class.active]="!selectedTag" 
        (click)="selectTag(null)"
      >
        All
      </button>
      <button 
        *ngFor="let tag of tags" 
        class="tag-chip" 
        [class.active]="selectedTag === tag" 
        (click)="selectTag(tag)"
      >
        {{ tag }}
      </button>
    </div>
  </div>

  <div class="posts-grid" *ngIf="posts.length > 0; else noPosts">
    <div 
      *ngFor="let post of (getFilteredPosts(posts) | filterPosts: searchTerm)" 
      class="post-card"
      [routerLink]="['/post', post.slug]"
    >
      <div class="post-content">
        <h2 class="post-title">{{ post.title }}</h2>
        <!-- Simple excerpt handling: remove potential HTML tags for better display -->
        <p class="post-excerpt">{{ post.content ? (post.content.substring(0, 150) + '...') : 'No content available.' }}</p>
        <div class="post-meta">
          <span class="post-date">{{ post.createdAt | date:'MMM d, y' }}</span>
          <div class="post-tags" *ngIf="post.tags && post.tags.length > 0">
            <span *ngFor="let tag of post.tags" class="post-tag">#{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noPosts>
    <div class="no-results">
      <p>Loading posts...</p>
    </div>
  </ng-template>

  <div *ngIf="posts.length > 0 && (getFilteredPosts(posts) | filterPosts: searchTerm).length === 0" class="no-results">
    <p>No posts found matching your criteria.</p>
  </div>
</div>
